name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint · Build · Unit test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Sinh Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build

      - name: Unit test
        run: npm test

  e2e:
    name: E2E test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_test
        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Sinh Prisma Client
        run: npx prisma generate

      - name: Tạo .env.test trỏ vào Postgres của runner
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/store_test
          JWT_SECRET=ci-chi-dung-cho-test-khong-phai-secret-that
          JWT_EXPIRES_IN=15m
          REFRESH_TOKEN_TTL_DAYS=7
          EMAIL_VERIFICATION_TTL_HOURS=24
          PASSWORD_RESET_TTL_MINUTES=60
          MAIL_QUEUE_ENABLED=false
          SMTP_HOST=
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          REDIS_DB=1
          EOF

      - name: E2E test
        run: npm run test:e2e

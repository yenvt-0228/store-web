name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write 

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false 

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.target.outputs.sha }}

    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Xác định commit cần đóng gói
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tính tên và tag cho image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=sha-${{ steps.target.outputs.short }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build và push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.target.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ghi kết quả ra trang tổng kết
        run: |
          {
            echo "### Image đã đẩy lên registry"
            echo ""
            echo "Commit: \`${{ steps.target.outputs.short }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Chạy thử:"
            echo '```bash'
            echo "docker run --rm -p 3000:3000 \\"
            echo "  -e DATABASE_URL='postgresql://...' \\"
            echo "  -e JWT_SECRET='...' \\"
            echo "  ghcr.io/${{ github.repository }}:sha-${{ steps.target.outputs.short }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy lên Render
    runs-on: ubuntu-latest
    needs: image

    steps:
      - name: Gọi Deploy Hook
        id: hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Chưa cấu hình secret RENDER_DEPLOY_HOOK_URL — bỏ qua bước deploy."
            echo "called=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "called=true" >> "$GITHUB_OUTPUT"
          echo "Đã yêu cầu Render deploy."

      # Không gọi hook thì Render chẳng deploy gì, poll cũng vô nghĩa.
      - name: Chờ bản mới lên sóng
        if: steps.hook.outputs.called == 'true'
        env:
          BASE_URL: ${{ vars.RENDER_SERVICE_URL }}
          WANT: ${{ needs.image.outputs.sha }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "Chưa cấu hình variable RENDER_SERVICE_URL — bỏ qua bước xác minh."
            exit 0
          fi

          echo "Chờ $BASE_URL/health báo version=$WANT"

          # Free tier vừa build vừa đánh thức container nên có thể lâu vài phút.
          # --max-time phải lớn hơn thời gian cold start của free tier (đo thực
          # tế ~50s), nếu không mọi lần poll lúc service đang ngủ đều timeout và
          # bị ghi nhận sai là "chưa trả lời".
          for i in $(seq 1 40); do
            GOT=$(curl -fsS --max-time 90 "$BASE_URL/health" 2>/dev/null \
              | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)

            if [ "$GOT" = "$WANT" ]; then
              echo "Bản mới đã chạy ở lần thử $i."
              exit 0
            fi

            echo "  lần $i: version=${GOT:-chưa trả lời}"
            sleep 15
          done

          echo "Thử 40 lần mà /health vẫn chưa báo đúng commit — xem log trên Render."
          echo "Kiểm tra biến RENDER_SERVICE_URL có trỏ đúng service API không."
          exit 1

      - name: Ghi kết quả ra trang tổng kết
        if: always()
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "Commit: \`${{ needs.image.outputs.sha }}\`"
            echo "URL: ${{ vars.RENDER_SERVICE_URL || 'chưa cấu hình' }}"
          } >> "$GITHUB_STEP_SUMMARY"
